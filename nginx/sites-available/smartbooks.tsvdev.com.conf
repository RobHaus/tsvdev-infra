# Legacy hostname. Browser traffic redirects to DiaryIQ; /v1 stays proxied so
# older extension installs keep working until they update the server URL.
#
# Reconciled from the live file. Retire this vhost, and its certificate, once no
# installed extension still points at smartbooks.tsvdev.com.
server {
    listen 80;
    listen [::]:80;
    server_name smartbooks.tsvdev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /v1/ {
        include /etc/nginx/snippets/tsvdev-proxy-params.conf;
        proxy_pass http://127.0.0.1:8572;
    }

    location / {
        return 301 https://diaryiq.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartbooks.tsvdev.com;

    ssl_certificate /etc/letsencrypt/live/smartbooks.tsvdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbooks.tsvdev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /v1/ {
        include /etc/nginx/snippets/tsvdev-proxy-params.conf;
        proxy_pass http://127.0.0.1:8572;
    }

    location / {
        return 301 https://diaryiq.com$request_uri;
    }
}
