# DiaryIQ staging (project: /home/rob/diaryiq-staging/, upstream 127.0.0.1:8573).
#
# Staging exists so migrations and builds are rehearsed somewhere real before a
# tag goes to diaryiq.com. It is not a public surface: it sits behind basic auth
# and asks search engines to stay away.
#
# The certificate was issued with the webroot authenticator, not the nginx
# plugin, so certbot does not rewrite this file and the copy in this repo stays
# authoritative:
#   sudo certbot certonly --webroot -w /var/www/html -d staging.diaryiq.com

server {
    listen 80;
    listen [::]:80;
    server_name staging.diaryiq.com;

    # Left unauthenticated and ahead of the redirect so webroot renewals work.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://staging.diaryiq.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.diaryiq.com;

    ssl_certificate /etc/letsencrypt/live/staging.diaryiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.diaryiq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Staging is proxied by Cloudflare like every other name on this host, so
    # the visitor address arrives in CF-Connecting-IP and this is what restores
    # it. The firewall only admits Cloudflare on 80 and 443 (ufw/rules.sh), so
    # taking staging off the proxy takes it off the internet.
    include /etc/nginx/snippets/tsvdev-cloudflare-real-ip.conf;

    # Stripe cannot answer a basic auth challenge, so a webhook behind one is an
    # endpoint that returns 401 to the only caller it has. It does not need the
    # password: it refuses anything without a valid signature over the raw body,
    # which is the same protection production relies on.
    location = /webhooks/stripe {
        include /etc/nginx/snippets/tsvdev-proxy-params.conf;
        proxy_pass http://127.0.0.1:8573;
    }

    location / {
        auth_basic "DiaryIQ staging";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;

        # Staging serves the same pages as production. Without this a search
        # engine that reached it could index a duplicate of the real site.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        include /etc/nginx/snippets/tsvdev-proxy-params.conf;
        proxy_pass http://127.0.0.1:8573;
    }
}
