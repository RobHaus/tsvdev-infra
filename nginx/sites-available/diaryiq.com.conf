# DiaryIQ production (project: /home/rob/diaryiq/, upstream 127.0.0.1:8572).
#
# Reconciled from the live file, which certbot had rewritten in place while this
# repo still held an HTTP-only copy. Applying that stale copy would have taken
# TLS off diaryiq.com. This version is the authoritative one.
#
# Certificate covers diaryiq.com and www.diaryiq.com:
#   sudo certbot --nginx -d diaryiq.com -d www.diaryiq.com
#
# Unlike certbot's generated form, port 80 keeps serving the ACME challenge
# rather than returning 404, so a webroot renewal also works.

server {
    listen 80;
    listen [::]:80;
    server_name diaryiq.com www.diaryiq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://diaryiq.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name diaryiq.com;

    ssl_certificate /etc/letsencrypt/live/diaryiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diaryiq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include /etc/nginx/snippets/tsvdev-proxy-params.conf;
        proxy_pass http://127.0.0.1:8572;
    }
}

# www redirects to the apex so there is one canonical origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.diaryiq.com;

    ssl_certificate /etc/letsencrypt/live/diaryiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diaryiq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://diaryiq.com$request_uri;
}
