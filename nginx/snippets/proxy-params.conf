# Shared proxy headers for upstreams on 127.0.0.1
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

# Set, not appended. $proxy_add_x_forwarded_for would carry through whatever the
# client sent, and an application reading the left-hand end of that list is
# reading attacker input. There is exactly one proxy in front of these
# upstreams, so one entry is the whole truth.
#
# $remote_addr is post-real_ip: behind Cloudflare it is the visitor, and on a
# host reached directly it is the peer. Either way it is observed, not claimed.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
